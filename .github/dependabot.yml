version: 2
updates:
  # Keep GitHub Actions themselves up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Gradle dependency updates (opens PRs for review)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    groups:
      androidx:
        patterns: ["androidx.*"]
      compose:
        patterns: ["androidx.compose.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
      hilt:
        patterns: ["com.google.dagger*", "androidx.hilt*"]
      okhttp:
        patterns: ["com.squareup.okhttp3*"]
      coil:
        patterns: ["io.coil-kt*"]
