name: Update Dependencies & Build

on:
  schedule:
    - cron: '0 3 * * 1'   # Every Monday at 03:00 UTC
  workflow_dispatch:        # Manual trigger from Actions tab
  push:
    branches: [ re-write ]
    paths:
      - '**.kt'
      - '**.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-deps:
    name: Update Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    outputs:
      updated: ${{ steps.check.outputs.updated }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26.x
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.3.11579264" \
            "build-tools;36.0.0" \
            "platforms;android-36"

      - name: Cache Gradle wrapper & caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run dependency version check & update TOML
        run: |
          ./gradlew versionCatalogUpdate \
            --no-configuration-cache \
            -Porg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m"

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet gradle/libs.versions.toml; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "No dependency updates found."
          else
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "Dependency updates found:"
            git diff gradle/libs.versions.toml
          fi

      - name: Commit updated versions
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml
          git commit -m "chore(deps): auto-update gradle version catalog [skip ci]"
          git push

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: update-deps
    permissions:
      contents: write

    steps:
      - name: Checkout (after possible dep update commit)
        uses: actions/checkout@v4
        with:
          ref: re-write   # always build from the latest commit on re-write
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26.x
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.3.11579264" \
            "build-tools;36.0.0" \
            "platforms;android-36"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Bump Gradle JVM args
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" \
            >> gradle.properties

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Porg.gradle.jvmargs="-Xmx4096m"

      - name: Build release APK (unsigned)
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Porg.gradle.jvmargs="-Xmx4096m"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToolNeuron-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ToolNeuron-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/apk -name "*.apk" | while read f; do
            size=$(du -sh "$f" | cut -f1)
            echo "| $(basename $f) | $size |" >> $GITHUB_STEP_SUMMARY
          done
